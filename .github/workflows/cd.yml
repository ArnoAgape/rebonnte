name: Android CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout du code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Rebuild keystore.properties
      - name: Decode keystore.properties
        run: echo "${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}" | base64 --decode > keystore.properties

      # Rebuild the keystore file from Base64
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      # Permissions pour gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build APK release
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PstorePassword=${{ secrets.KEYSTORE_PASSWORD }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PstoreFile=upload-keystore.jks

      # Upload vers Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Automated release from GitHub tag ${{ github.ref_name }}"
          testers: "arno.bouiron@gmail.com"